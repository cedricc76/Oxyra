# nginx.conf
# PELETAKAN: root proyek, sejajar docker-compose.yml

server {
    listen 80;
    server_name _;

    # ── Frontend ──
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Backend IQAIR ──
    # /api/iqair/chat → backend-iqair menerima /chat (prefix dibuang).
    # Jika route FastAPI-mu sudah punya prefix sendiri, sesuaikan proxy_pass.
    location /api/iqair/ {
        proxy_pass http://backend-iqair:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;              # WAJIB untuk streaming SSE
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;          # inference model bisa lama
        proxy_send_timeout 300s;
    }

    # ── Backend USA ──
    location /api/usa/ {
        proxy_pass http://backend-usa:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
